<svg viewBox="0 0 640 300" width="640" height="300" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="0" y="0" width="640" height="300" fill="#ffffff"/><circle cx="22" cy="36" r="4" fill="#a68831" stroke="#a68831" stroke-width="0"/><text x="32" y="40" font-size="11" fill="#151413" text-anchor="start" font-weight="normal">ПЕРЕДАЧА CPU → ПК: SOD (нога 4) → P72 → P39 → RXD моста (выв. 3)</text><circle cx="22" cy="58" r="4" fill="#3f8656" stroke="#3f8656" stroke-width="0"/><text x="32" y="62" font-size="11" fill="#151413" text-anchor="start" font-weight="normal">ПРИЁМ CPU ← ПК: TXD моста (выв. 2) → P38 → SID (нога 5)</text><rect x="14" y="92" width="88" height="118" fill="#e9e8e5" stroke="#5e5845" stroke-width="1.5" rx="0"/><rect x="130" y="92" width="150" height="118" fill="#e9e8e5" stroke="#5e5845" stroke-width="1.5" rx="0"/><rect x="310" y="84" width="160" height="134" fill="#e9e8e5" stroke="#5e5845" stroke-width="1.5" rx="0"/><rect x="502" y="84" width="124" height="134" fill="#e9e8e5" stroke="#5e5845" stroke-width="1.5" rx="0"/><text x="58" y="116" font-size="13" fill="#151413" text-anchor="middle" font-weight="bold">ПК</text><text x="58" y="138" font-size="10.5" fill="#8b8881" text-anchor="middle" font-weight="normal">виртуальный</text><text x="58" y="154" font-size="10.5" fill="#151413" text-anchor="middle" font-weight="normal">COM-порт</text><text x="58" y="174" font-size="10.5" fill="#151413" text-anchor="middle" font-weight="normal">терминал</text><text x="58" y="192" font-size="11" fill="#7a6415" text-anchor="middle" font-weight="bold">4800 8N1</text><text x="205" y="114" font-size="12.5" fill="#151413" text-anchor="middle" font-weight="bold">CH340G · U6</text><text x="205" y="132" font-size="10.5" fill="#8b8881" text-anchor="middle" font-weight="normal">USB-UART мост</text><text x="272" y="150" font-size="10.5" fill="#7a6415" text-anchor="end" font-weight="normal">RXD (выв. 3)</text><text x="138" y="172" font-size="10.5" fill="#2d5c40" text-anchor="start" font-weight="normal">TXD (выв. 2)</text><text x="205" y="196" font-size="10" fill="#8b8881" text-anchor="middle" font-weight="normal">кварц X1 12 МГц</text><text x="390" y="104" font-size="12" fill="#151413" text-anchor="middle" font-weight="bold">CPLD U1 · XC95108</text><text x="390" y="122" font-size="10" fill="#8b8881" text-anchor="middle" font-weight="normal">транзиты:</text><text x="390" y="142" font-size="10.5" fill="#7a6415" text-anchor="middle" font-weight="normal">TX (P39) = SOD (P72)</text><text x="390" y="162" font-size="10.5" fill="#2d5c40" text-anchor="middle" font-weight="normal">SID (P73) = RX (P38)</text><text x="390" y="186" font-size="9.5" fill="#8b8881" text-anchor="middle" font-weight="normal">TX-маска: после сброса</text><text x="390" y="202" font-size="9.5" fill="#8b8881" text-anchor="middle" font-weight="normal">51 мкс линия TX = «1»</text><text x="564" y="106" font-size="12.5" fill="#151413" text-anchor="middle" font-weight="bold">1821ВМ85</text><text x="564" y="124" font-size="10" fill="#8b8881" text-anchor="middle" font-weight="normal">(i8085)</text><text x="564" y="144" font-size="10.5" fill="#7a6415" text-anchor="middle" font-weight="normal">SOD · нога 4</text><text x="564" y="164" font-size="10.5" fill="#2d5c40" text-anchor="middle" font-weight="normal">SID · нога 5</text><text x="564" y="186" font-size="10.5" fill="#151413" text-anchor="middle" font-weight="normal">RIM / SIM</text><text x="564" y="202" font-size="9.5" fill="#8b8881" text-anchor="middle" font-weight="normal">кадр строит программа</text><line x1="502" y1="146" x2="470" y2="146" stroke="#a68831" stroke-width="2"/><polygon points="474,142 474,150 467,146" fill="#a68831"/><line x1="470" y1="164" x2="502" y2="164" stroke="#3f8656" stroke-width="2"/><polygon points="498,160 498,168 505,164" fill="#3f8656"/><line x1="310" y1="146" x2="280" y2="146" stroke="#a68831" stroke-width="2"/><polygon points="284,142 284,150 277,146" fill="#a68831"/><line x1="280" y1="164" x2="310" y2="164" stroke="#3f8656" stroke-width="2"/><polygon points="306,160 306,168 313,164" fill="#3f8656"/><line x1="130" y1="146" x2="102" y2="146" stroke="#a68831" stroke-width="2"/><polygon points="106,142 106,150 99,146" fill="#a68831"/><line x1="102" y1="164" x2="130" y2="164" stroke="#3f8656" stroke-width="2"/><polygon points="126,160 126,168 133,164" fill="#3f8656"/><text x="116" y="192" font-size="9.5" fill="#8b8881" text-anchor="middle" font-weight="normal">USB-C</text><text x="16" y="244" font-size="10.5" fill="#151413" text-anchor="start" font-weight="normal">Уровни TTL: 0…+5 В — это не RS-232 (±12 В); покой линии = «1», старт-бит = «0», формат 8N1</text><text x="16" y="264" font-size="10.5" fill="#151413" text-anchor="start" font-weight="normal">Скорость задаёт терминал: она настраивает делитель моста и обязана совпадать со скоростью программы</text><text x="16" y="284" font-size="10.5" fill="#8b8881" text-anchor="start" font-weight="normal">Цепи платы «TX»/«RX» названы со стороны моста: «TX» идёт от TXD, «RX» — к RXD</text></svg>